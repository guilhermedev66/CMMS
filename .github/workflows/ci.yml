name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Cmms.sln

      - name: Build
        run: dotnet build Cmms.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Cmms.sln --configuration Release --no-build --logger "console;verbosity=normal"

  frontend:
    name: Frontend (lint + typecheck + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck + build
        run: npm run build

      - name: Test
        run: npm run test

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Proves src/Cmms.Api/Dockerfile actually builds a deployable image on a clean checkout —
      # M4/M5 both shipped without this (the .NET/frontend jobs above never exercised the Dockerfile
      # at all), so a broken image could have reached `main` unnoticed. Not pushed anywhere; this is
      # purely a build-succeeds gate, same spirit as the other two jobs.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Cmms.Api/Dockerfile
          push: false
          tags: cmms-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
